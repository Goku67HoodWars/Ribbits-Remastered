name: Publish CurseForge Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        env:
          GITHUB_TAG: ${{ github.event.release.tag_name }}
        run: sh ./gradlew build

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1726493
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc|javadocs)).jar
            forge/build/libs/!(*-@(dev|sources|javadoc|javadocs)).jar
            neoforge/build/libs/!(*-@(dev|sources|javadoc|javadocs)).jar
          name: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          version-type: release
          changelog: ${{ github.event.release.body }}

          loaders: |
            fabric
            forge
            neoforge
          game-versions: |
            26.3
          java: 25

          # GeckoLib is the only hard dependency (Fabric also needs Fabric API — add that on the
          # Fabric file in the CurseForge UI if you publish the loaders separately).
          dependencies: |
            geckolib(required)
