# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

# Project
version=1.0.1
maven_group=com.yungnickyoung.minecraft.ribbits
archives_name=ribbits
java_version=25
enabled_platforms=fabric,forge,neoforge

# Metadata (OUR identity — original Ribbits team credited; NOT HB's project/identity)
mod_name=RibbitsRemastered
mod_full_name=Ribbits Remastered
mod_id=ribbits
mod_author=YUNGNICKYOUNG
mod_description=A standalone, dependency-free remaster of Ribbits — cute little frogs that live in swamp villages.
mod_credits=Thank you to everyone who supported the official Ribbits plushie campaign!
license=LGPLv3

# Minecraft
mc_version=26.2
minecraft_version=26.2
mc_version_range_fabric=>=26.2 <26.3
mc_version_range_forge=[26.2,26.3)
mc_version_range_neoforge=[26.2,26.3)

# Loaders (forge/neoforge/fabric_loader from HB's proven 26.2 build)
fabric_loader_version=0.19.5
fabric_version=0.160.0
forge_version=26.2-65.1.3
neoforge_version=26.2.0.87

# Dependencies
geckolib_version=5.5.5
# fabric.mod.json references ${geckolib_version_fabric}; kept identical to geckolib_version so that resource file needs no edit.
geckolib_version_fabric=5.5.5
clothconfig_version_fabric=26.2.155
# VERIFY on https://maven.shedaniel.me/ — cloth-config-forge / cloth-config-neoforge coordinates for MC 26.2 are unknown (HB does not use cloth). Likely the same 26.2.x line as fabric; confirm the exact built artifacts exist before first forge/neoforge build.
clothconfig_version_forge=26.2.155
clothconfig_version_neoforge=26.2.155
modmenu_version_fabric=20.0.1

# CurseForge Publishing
curseforgegradle_version=1.1.15
compatible_versions=26.2
curseforge_project_id=1555275
debug_publish=false
# Overwritten by global gradle.properties.
curseforgeApiKey=""
